name: tgvideo

# Production compose: pulls pre-built images from ghcr.io (built by the
# `build-and-publish` GitHub Actions workflow). No local build context.
#
# Set these in `.env` next to this file (or pass --env-file):
#   IMAGE_OWNER     repo owner (lowercase), e.g. a186232641
#   IMAGE_TAG       image tag, e.g. latest, main, sha-1a2b3c4 (default: latest)
#   DOMAIN          Caddy site address (real domain ⇒ Let's Encrypt; localhost ⇒ self-signed)
#   POSTGRES_*      database credentials
#   TG_API_ID / TG_API_HASH / JWT_SECRET / MASTER_KEY / CACHE_CAP_GB

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ghcr.io/${IMAGE_OWNER}/onlineplaytgvedio-server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVER_ADDR: ":8080"
      DOMAIN: ${DOMAIN}
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      CACHE_DIR: /var/cache/tgvideo
      CACHE_CAP_GB: ${CACHE_CAP_GB:-50}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tgcache:/var/cache/tgvideo

  caddy:
    image: ghcr.io/${IMAGE_OWNER}/onlineplaytgvedio-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - tgcache:/var/cache/tgvideo:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - server

volumes:
  pgdata:
  tgcache:
  caddydata:
  caddyconfig:
